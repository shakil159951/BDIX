name: Auto Scrape & Update M3U

on:
  schedule:
    - cron: '0 */12 * * *' # প্রতি ১২ ঘণ্টা পর পর অটো রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-playlist:
    runs-on: self-hosted # আপনার লোকাল রানার ব্যবহার করার জন্য

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update channels.m3u [skip ci]" && git push)
